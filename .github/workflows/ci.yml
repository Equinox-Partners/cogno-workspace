name: CI

on:
  push:
      branches: [ main, develop ]
        pull_request:
            branches: [ main, develop ]

            jobs:
              validate-task-structure:
                  runs-on: ubuntu-latest
                      steps:
                            - uses: actions/checkout@v4

                                  - name: Validate Cogno task structure
                                          run: |
                                                    # ブランチ名がgitの場合はtask-値を使用、main/developは一寸を残す
                                                              BRANCH=$(git rev-parse --abbrev-ref HEAD)
                                                                        if [[ ! "$BRANCH" =~ ^(main|develop|task-[0-9a-zA-Z_-]+)$ ]]; then
                                                                                    echo "Error: Branch must follow naming convention task-<ID>"
                                                                                                exit 1
                                                                                                          fi
                                                                                                          
                                                                                                                - name: Validate .cogno directory
                                                                                                                        run: |
                                                                                                                                  # 必要のCogno設定ファイルの確認
                                                                                                                                            test -f .cogno/repo.json || echo "Warning: repo.json missing"
                                                                                                                                                      test -f .cogno/app-context.md || echo "Warning: app-context.md missing"
                                                                                                                                                      
                                                                                                                                                        lint-and-test:
                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                steps:
                                                                                                                                                                      - uses: actions/checkout@v4
                                                                                                                                                                      
                                                                                                                                                                            - name: Set up Node.js
                                                                                                                                                                                    uses: actions/setup-node@v3
                                                                                                                                                                                            with:
                                                                                                                                                                                                      node-version: '18'
                                                                                                                                                                                                      
                                                                                                                                                                                                            - name: Install dependencies
                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                              npm install || echo "No package.json found, skipping npm install"
                                                                                                                                                                                                                              
                                                                                                                                                                                                                                    - name: Run linter
                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                      npm run lint 2>/dev/null || echo "No lint script found"
                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                            - name: Run tests
                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                              npm test 2>/dev/null || echo "No test script found"
                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                    - name: Check Cogno task metadata
                                                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                                                      # タスクメタデータが有効かチェック
                                                                                                                                                                                                                                                                                                                if [ -f .cogno/task.json ]; then
                                                                                                                                                                                                                                                                                                                            echo "Task metadata found:"
                                                                                                                                                                                                                                                                                                                                        cat .cogno/task.json | jq . || echo "Invalid JSON format"
                                                                                                                                                                                                                                                                                                                                                  else
                                                                                                                                                                                                                                                                                                                                                              echo "No task metadata file found"
                                                                                                                                                                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                          cogno-integration:
                                                                                                                                                                                                                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                  if: startsWith(github.ref, 'refs/heads/task-')
                                                                                                                                                                                                                                                                                                                                                                                      steps:
                                                                                                                                                                                                                                                                                                                                                                                            - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                  - name: Extract Task ID from branch
                                                                                                                                                                                                                                                                                                                                                                                                          id: task-id
                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                            TASK_ID=$(git rev-parse --abbrev-ref HEAD | sed 's/task-//')
                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "Task ID: $TASK_ID"
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Register task with Cogno
                                                                                                                                                                                                                                                                                                                                                                                                                                                              if: ${{ secrets.COGNO_API_TOKEN != '' }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "Registering task ${{ steps.task-id.outputs.task_id }} with Cogno"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "(Integration will be enabled when COGNO_API_TOKEN is configured)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # TODO: Uncomment when Cogno API endpoint is configured
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # curl -X POST ${{ secrets.COGNO_API_ENDPOINT }}/tasks/register \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # -H "Authorization: Bearer ${{ secrets.COGNO_API_TOKEN }}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # -H "Content-Type: application/json" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # -d '{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # "taskId": "${{ steps.task-id.outputs.task_id }}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # "branch": "${{ github.ref }}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # "repository": "${{ github.repository }}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # "commitSha": "${{ github.sha }}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # }'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Wait for Cogno task completion
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if: ${{ secrets.COGNO_API_TOKEN != '' }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "Waiting for Cogno task completion"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "(Integration will be enabled when COGNO_API_TOKEN is configured)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # TODO: Implement polling logic when Cogno API is ready
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
